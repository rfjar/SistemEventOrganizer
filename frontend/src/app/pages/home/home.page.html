<ion-header>
  <ion-toolbar>
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>mYEvEnT</h1>
      <p>Selamat datang di aplikasi organizer event!</p>
    </div>

    <!-- Gambar Ilustrasi -->
    <img 
      src="https://cdn-icons-png.flaticon.com/512/3142/3142423.png" 
      alt="Event Illustration"
      class="illustration"
    />

    <!-- Tombol Aksi -->
    <div class="action-buttons">
      <ion-button 
        expand="block" 
        shape="round" 
        color="primary" 
        routerLink="/register"
      >
        Daftar Sekarang
      </ion-button>

      <ion-button 
        expand="block" 
        fill="outline" 
        shape="round" 
        color="medium" 
        routerLink="/login"
      >
        Sudah Punya Akun? Login
      </ion-button>
    </div>
  </div>
</ion-content>
